<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financial Statement Analysis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,500&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ink:#1c2320;
    --ink-soft:#4b5650;
    --paper:#eef1ef;
    --surface:#ffffff;
    --rule:#c7d0cb;
    --rule-strong:#a9b6b0;
    --accent:#0f6b57;
    --accent-soft:#dbe9e4;
    --flag:#a8752c;
    --shadow: 0 1px 2px rgba(28,35,32,.06), 0 8px 24px rgba(28,35,32,.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#e8ece9;
      --ink-soft:#a8b3ac;
      --paper:#101513;
      --surface:#182420;
      --rule:#2b3733;
      --rule-strong:#3c4a44;
      --accent:#4fd0ab;
      --accent-soft:#1d332c;
      --flag:#d9a55a;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --ink:#e8ece9;
    --ink-soft:#a8b3ac;
    --paper:#101513;
    --surface:#182420;
    --rule:#2b3733;
    --rule-strong:#3c4a44;
    --accent:#4fd0ab;
    --accent-soft:#1d332c;
    --flag:#d9a55a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Public Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh;}
  a{color:inherit;}
  .mono{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums;}
  .serif{font-family:"Newsreader", Georgia, serif;}

  /* ---------- INDEX ---------- */
  .index-wrap{
    max-width:760px;
    margin:0 auto;
    padding:clamp(28px,6vw,72px) 20px 80px;
  }
  .masthead{
    border-bottom:2px solid var(--ink);
    padding-bottom:20px;
    margin-bottom:8px;
  }
  .kicker{
    font-family:"IBM Plex Mono", monospace;
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 10px;
  }
  .masthead h1{
    font-family:"Newsreader", Georgia, serif;
    font-weight:600;
    font-size:clamp(30px,5.2vw,46px);
    line-height:1.08;
    margin:0 0 12px;
    text-wrap:balance;
  }
  .masthead p{
    margin:0;
    color:var(--ink-soft);
    font-size:15px;
    max-width:56ch;
  }
  .toc{
    list-style:none;
    margin:0;
    padding:0;
  }
  .toc-row{
    display:grid;
    grid-template-columns:52px 1fr auto auto;
    align-items:baseline;
    gap:18px;
    padding:22px 4px;
    border-bottom:1px solid var(--rule);
    cursor:pointer;
    text-decoration:none;
    color:inherit;
    transition:background .12s ease;
  }
  .toc-row:first-child{border-top:1px solid var(--rule);}
  .toc-row:hover{background:var(--accent-soft);}
  .toc-row:hover .toc-name{color:var(--accent);}
  .toc-mat-row{
    display:block;
    padding:8px 4px 12px 70px;
    margin-top:-1px;
    border-bottom:1px solid var(--rule);
    font-family:"IBM Plex Mono", monospace;
    font-size:12.5px;
    color:var(--accent);
    text-decoration:none;
  }
  .toc-mat-row:hover{background:var(--accent-soft); text-decoration:underline;}
  .toc-num{
    font-family:"IBM Plex Mono", monospace;
    font-size:13px;
    color:var(--ink-soft);
  }
  .toc-body{min-width:0;}
  .toc-name{
    font-family:"Newsreader", Georgia, serif;
    font-size:clamp(19px,2.6vw,24px);
    font-weight:500;
    display:block;
    transition:color .12s ease;
  }
  .toc-sub{
    display:block;
    font-size:13px;
    color:var(--ink-soft);
    margin-top:3px;
  }
  .toc-count{
    font-family:"IBM Plex Mono", monospace;
    font-size:13px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .toc-go{
    font-family:"IBM Plex Mono", monospace;
    font-size:13px;
    color:var(--accent);
    white-space:nowrap;
  }
  .index-foot{
    margin-top:28px;
    font-size:12.5px;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .index-foot a{color:var(--accent); text-decoration:none;}
  .index-foot a:hover{text-decoration:underline;}
  @media (max-width:480px){
    .toc-row{grid-template-columns:34px 1fr;}
    .toc-count{display:none;}
    .toc-go{grid-column:2; justify-self:start; margin-top:6px;}
  }

  /* ---------- ABOUT ---------- */
  .about-wrap{
    max-width:720px;
    margin:0 auto;
    padding:clamp(24px,5vw,60px) 20px 90px;
  }
  .about-wrap .back-link{margin-bottom:26px;}
  .about-wrap h1{
    font-family:"Newsreader", Georgia, serif;
    font-weight:600;
    font-size:clamp(28px,4.6vw,40px);
    line-height:1.1;
    margin:0 0 10px;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
  }
  .about-tagline{
    color:var(--ink-soft);
    font-size:16px;
    margin:0 0 26px;
  }
  .fact-grid{
    display:grid;
    grid-template-columns:auto 1fr;
    gap:6px 18px;
    font-size:14px;
    margin:0 0 30px;
    padding-bottom:26px;
    border-bottom:1px solid var(--rule);
  }
  .fact-grid dt{
    font-family:"IBM Plex Mono", monospace;
    font-size:12px;
    letter-spacing:.02em;
    text-transform:uppercase;
    color:var(--ink-soft);
    padding-top:2px;
  }
  .fact-grid dd{margin:0;}
  .about-sec{margin:0 0 26px;}
  .about-sec h2{
    font-family:"Newsreader", Georgia, serif;
    font-weight:600;
    font-size:20px;
    margin:0 0 10px;
  }
  .about-sec p{
    font-size:15.5px;
    line-height:1.6;
    margin:0 0 10px;
    color:var(--ink);
  }
  .about-sec ul{
    margin:0;
    padding:0;
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .about-sec li{
    font-size:15px;
    line-height:1.5;
    padding-left:20px;
    position:relative;
  }
  .about-sec li::before{
    content:"—";
    position:absolute; left:0; top:0;
    color:var(--accent);
  }
  .about-note{
    margin-top:34px;
    font-size:12.5px;
    color:var(--ink-soft);
    border-top:1px solid var(--rule);
    padding-top:16px;
  }

  /* ---------- DECK ---------- */
  .deck{
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  .deck-bar{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 20px;
    border-bottom:1px solid var(--rule);
    background:var(--surface);
    position:sticky; top:0; z-index:5;
  }
  .back-link{
    font-family:"IBM Plex Mono", monospace;
    font-size:13px;
    text-decoration:none;
    color:var(--ink-soft);
    display:inline-flex; align-items:center; gap:6px;
    padding:4px 2px;
  }
  .back-link:hover{color:var(--accent);}
  .deck-title{
    font-family:"Newsreader", Georgia, serif;
    font-size:15px;
    font-weight:600;
    color:var(--ink-soft);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .deck-mat{margin-left:auto; display:flex; gap:14px;}
  .deck-pos{
    margin-left:auto;
    font-family:"IBM Plex Mono", monospace;
    font-size:13px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .deck-mat + .deck-pos{margin-left:16px;}
  @media (max-width:640px){ .deck-mat{display:none;} }
  .progress-rule{
    height:2px;
    background:var(--rule);
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    transition:width .18s ease;
  }
  .stage-wrap{
    flex:1;
    position:relative;
    display:flex;
  }
  .tap-zone{
    position:absolute; top:0; bottom:0; width:18%; z-index:3;
    cursor:pointer;
  }
  .tap-zone.left{left:0;}
  .tap-zone.right{right:0;}
  .stage{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 24px 100px;
    overflow-y:auto;
  }
  .slide{
    width:100%;
    max-width:760px;
  }
  .slide h2{
    font-family:"Newsreader", Georgia, serif;
    font-weight:600;
    font-size:clamp(24px,4vw,34px);
    margin:0 0 22px;
    text-wrap:balance;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
  }
  .slide.is-divider{
    text-align:center;
    max-width:640px;
  }
  .slide.is-divider .divider-title{
    font-family:"Newsreader", Georgia, serif;
    font-weight:600;
    font-size:clamp(30px,6vw,52px);
    line-height:1.12;
    margin:0 0 14px;
    text-wrap:balance;
  }
  .slide.is-divider .divider-rule{
    width:64px; height:3px; background:var(--accent);
    margin:0 auto 18px;
  }
  .slide.is-divider .divider-sub{
    font-size:16px; color:var(--ink-soft);
  }
  .bullets{
    list-style:none;
    margin:0; padding:0;
    display:flex; flex-direction:column; gap:10px;
  }
  .bullets li{
    font-size:17px;
    line-height:1.5;
    padding-left:22px;
    position:relative;
  }
  .bullets li::before{
    content:"—";
    position:absolute; left:0; top:0;
    color:var(--accent);
  }
  .bullets li[data-level="1"]{
    margin-left:26px;
    font-size:15.5px;
    color:var(--ink-soft);
  }
  .bullets li[data-level="1"]::before{content:"·"; font-size:20px; top:-3px;}
  .bullets li[data-level="2"]{margin-left:50px; font-size:14.5px;}
  .bullets li[data-level="3"]{margin-left:74px; font-size:14px;}
  .aside-note{
    margin-top:18px;
    font-size:12.5px;
    font-family:"IBM Plex Mono", monospace;
    color:var(--flag);
    border:1px dashed var(--flag);
    display:inline-block;
    padding:4px 9px;
    border-radius:3px;
  }
  .tbl-wrap{
    overflow-x:auto;
    margin-top:6px;
    border:1px solid var(--rule-strong);
  }
  table.ledger{
    border-collapse:collapse;
    width:100%;
    font-size:14.5px;
  }
  table.ledger td{
    padding:8px 12px;
    border-bottom:1px solid var(--rule);
    border-right:1px solid var(--rule);
    vertical-align:top;
    white-space:pre-line;
  }
  table.ledger tr:first-child td{
    font-family:"IBM Plex Mono", monospace;
    font-size:12px;
    letter-spacing:.03em;
    text-transform:uppercase;
    color:var(--ink-soft);
    background:var(--accent-soft);
  }
  table.ledger td:last-child{border-right:none;}
  table.ledger tr:last-child td{border-bottom:none;}
  table.ledger td.num{
    font-family:"IBM Plex Mono", monospace;
    text-align:right;
    font-variant-numeric:tabular-nums;
  }
  figure.slide-img{
    margin:0; text-align:center;
  }
  figure.slide-img img{
    max-width:100%;
    max-height:56vh;
    border:1px solid var(--rule-strong);
    cursor:zoom-in;
    background:var(--surface);
  }
  figure.slide-img figcaption{
    margin-top:8px;
    font-size:12px;
    color:var(--ink-soft);
    font-family:"IBM Plex Mono", monospace;
  }
  figure.slide-img figcaption .zoom-hint{color:var(--accent);}

  /* ---------- CONCEPT DIAGRAMS ---------- */
  .diagram{
    margin-top:6px;
    font-size:14.5px;
  }
  .eq{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0;
    border:1px solid var(--rule-strong);
  }
  .eq-col{padding:0;}
  .eq-col.left{border-right:2px solid var(--ink);}
  .eq-box{
    padding:14px 16px;
    border-bottom:1px solid var(--rule);
  }
  .eq-col .eq-box:last-child{border-bottom:none;}
  .eq-box .eq-h{
    font-family:"IBM Plex Mono", monospace;
    font-size:12px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--accent);
    display:block;
    margin-bottom:6px;
  }
  .eq-box ul{
    margin:0; padding:0; list-style:none;
    display:flex; flex-direction:column; gap:3px;
  }
  .eq-box li{font-size:13.5px; color:var(--ink-soft);}
  .eq-note{
    display:flex;
    font-family:"IBM Plex Mono", monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:6px;
  }
  .eq-note span{flex:1;}
  .eq-note span:last-child{text-align:right;}
  .stackd{
    border:1px solid var(--rule-strong);
    max-width:420px;
  }
  .stackd div{
    padding:12px 16px;
    border-bottom:1px solid var(--rule);
    font-family:"IBM Plex Mono", monospace;
    font-size:14px;
  }
  .stackd div:last-child{
    border-bottom:none;
    color:var(--accent);
    background:var(--accent-soft);
  }
  .diagram-cap{
    margin-top:8px;
    font-size:13px;
    color:var(--ink-soft);
  }

  /* ---------- MATERIALS ---------- */
  .mat-wrap{
    max-width:760px;
    margin:0 auto;
    padding:clamp(24px,5vw,60px) 20px 90px;
  }
  .mat-wrap .back-link{margin-bottom:26px;}
  .mat-wrap h1{
    font-family:"Newsreader", Georgia, serif;
    font-weight:600;
    font-size:clamp(26px,4.4vw,38px);
    line-height:1.1;
    margin:0 0 10px;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
  }
  .mat-intro{color:var(--ink-soft); font-size:15px; margin:0 0 30px; max-width:60ch;}
  .mat-set{margin:0 0 14px;}
  .mat-set-head{
    display:flex; align-items:baseline; justify-content:space-between;
    gap:14px; flex-wrap:wrap;
    border-bottom:1px solid var(--rule);
    padding-bottom:8px; margin-bottom:18px;
  }
  .mat-set-head h2{
    font-family:"Newsreader", Georgia, serif;
    font-weight:600; font-size:22px; margin:0;
  }
  .dl-link{
    font-family:"IBM Plex Mono", monospace;
    font-size:12px;
    text-decoration:none;
    color:var(--accent);
    border:1px solid var(--accent);
    border-radius:3px;
    padding:4px 9px;
    white-space:nowrap;
  }
  .dl-link:hover{background:var(--accent-soft);}
  .exercise{
    margin:0 0 26px;
    padding:0 0 22px;
    border-bottom:1px dashed var(--rule);
  }
  .exercise:last-child{border-bottom:none;}
  .exercise h3{
    font-family:"Newsreader", Georgia, serif;
    font-weight:600; font-size:18px; margin:0 0 12px;
  }
  .exercise p{font-size:15px; line-height:1.55; margin:0 0 12px;}
  .exercise ul, .exercise ol{
    margin:0 0 12px; padding-left:22px;
    display:flex; flex-direction:column; gap:8px;
  }
  .exercise li{font-size:14.5px; line-height:1.5;}
  .exercise .mat-note{
    font-size:13px; color:var(--ink-soft); font-style:italic;
    border-left:2px solid var(--rule-strong); padding-left:12px; margin:0 0 12px;
  }
  .mat-refs{margin-top:14px;}
  .mat-refs h2{
    font-family:"Newsreader", Georgia, serif;
    font-weight:600; font-size:22px; margin:0 0 16px;
    border-bottom:1px solid var(--rule); padding-bottom:8px;
  }
  .ref-item{margin:0 0 16px;}
  .ref-item .ref-label{font-size:15px; font-weight:600; display:block;}
  .ref-item .ref-note{font-size:13.5px; color:var(--ink-soft); display:block; margin:2px 0 6px; max-width:60ch;}
  .ref-item .ref-links{display:flex; gap:8px; flex-wrap:wrap;}

  .content-body{
    display:flex; flex-direction:column; gap:22px;
  }
  .deck-controls{
    position:sticky; bottom:0;
    display:flex; align-items:center; justify-content:center; gap:16px;
    padding:14px;
    background:linear-gradient(to top, var(--paper) 60%, transparent);
    z-index:4;
  }
  .ctrl-btn{
    font-family:"IBM Plex Mono", monospace;
    font-size:13px;
    background:var(--surface);
    border:1px solid var(--rule-strong);
    color:var(--ink);
    padding:9px 16px;
    border-radius:3px;
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .ctrl-btn:hover{border-color:var(--accent); color:var(--accent);}
  .ctrl-btn:disabled{opacity:.35; cursor:default;}
  .ctrl-btn:disabled:hover{border-color:var(--rule-strong); color:var(--ink);}

  .lightbox{
    position:fixed; inset:0; background:rgba(10,14,12,.86);
    display:flex; align-items:center; justify-content:center;
    padding:5vh 5vw;
    z-index:50; cursor:zoom-out;
  }
  .lightbox img{max-width:100%; max-height:100%;}
  [hidden]{display:none !important;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>

<div id="app"></div>
<script type="application/json" id="deck-data">__DECK_JSON__</script>
<script type="application/json" id="overrides-data">__OVERRIDES_JSON__</script>
<script type="application/json" id="about-data">__ABOUT_JSON__</script>
<script type="application/json" id="materials-data">__MATERIALS_JSON__</script>
<script>
(function(){
  var DATA = JSON.parse(document.getElementById('deck-data').textContent);
  var OVERRIDES = JSON.parse(document.getElementById('overrides-data').textContent);
  var ABOUT = JSON.parse(document.getElementById('about-data').textContent);
  var MATERIALS = JSON.parse(document.getElementById('materials-data').textContent);
  var ORDER = ["unit1","unit2","unit3","unit4","unit5"];
  var HIDDEN = (OVERRIDES._config && OVERRIDES._config.hidden) || [];
  function isHidden(key){ return HIDDEN.indexOf(key) !== -1; }
  function visibleUnits(){
    return ORDER.filter(function(k){ return DATA[k] && !isHidden(k); });
  }
  var app = document.getElementById('app');

  // --- apply hand-authored fixes from data/overrides.json ---
  function applyOverrides(){
    ORDER.forEach(function(key){
      var u = DATA[key];
      if(!u) return;
      var ov = OVERRIDES[key] || {};
      u.slides.forEach(function(slide, i){
        var o = ov[String(i+1)];
        // always drop speaker-tag asides like "#faithful_image"
        slide.asides = (slide.asides || []).filter(function(a){
          return a && a.trim()[0] !== '#';
        });
        if(!o) return;
        if(o.title != null) slide.title = o.title;
        if(o.dropTables) slide.tables = [];
        if(o.dropImages) slide.images = [];
        if(o.hideAsides) slide.asides = [];
        if(o.diagram) slide.diagram = o.diagram;
        if(o.caption != null){
          if(slide.images && slide.images.length) slide.images[0].caption = o.caption;
          else slide.caption = o.caption;
        }
      });
    });
  }

  function esc(s){
    return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function nl2br(s){ return esc(s).replace(/\n/g,"<br>"); }
  function attr(s){ return esc(s).replace(/"/g,"&quot;"); }
  function looksNumeric(s){
    var t = (s||"").trim();
    if(!t) return false;
    return /^[\-\(]?[\d.,%\s]+\)?$/.test(t) && /\d/.test(t);
  }

  function hasExercises(key){
    var m = MATERIALS[key];
    return !!(m && m.exercises && m.exercises.sets && m.exercises.sets.length);
  }
  function hasReferences(key){
    var m = MATERIALS[key];
    return !!(m && m.references && m.references.length);
  }

  function renderIndex(){
    var rows = visibleUnits().map(function(key, i){
      var u = DATA[key];
      var row = '<a class="toc-row" href="#/'+key+'/1">' +
        '<span class="toc-num mono">'+String(i+1).padStart(2,'0')+'</span>' +
        '<span class="toc-body"><span class="toc-name">'+esc(u.unit)+' — '+esc(u.name)+'</span>' +
          '<span class="toc-sub">'+u.slides.length+' slides</span></span>' +
        '<span class="toc-count mono">'+u.slides.length+'</span>' +
        '<span class="toc-go">Open →</span>' +
      '</a>';
      if(hasExercises(key)){
        row += '<a class="toc-mat-row" href="#/'+key+'/exercises">Exercises →</a>';
      }
      if(hasReferences(key)){
        row += '<a class="toc-mat-row" href="#/'+key+'/references">Reference material →</a>';
      }
      return row;
    }).join("");

    app.innerHTML =
      '<div class="index-wrap">' +
        '<div class="masthead">' +
          '<p class="kicker">Financial Statement Analysis</p>' +
          '<h1>Course slides</h1>' +
          '<p>The units of the course, in web format. Navigate with the keyboard arrows, by tapping the sides, or with the buttons at the bottom. More units are added as the course progresses.</p>' +
        '</div>' +
        '<ul class="toc">' + rows + '</ul>' +
        '<div class="index-foot">' +
          '<span><a href="#/about">About the course →</a></span>' +
          '<span>jorge.gallud@uva.es · University of Valladolid</span>' +
        '</div>' +
      '</div>';
    document.title = "Financial Statement Analysis";
  }

  function renderAbout(){
    var a = ABOUT;
    var facts = (a.facts||[]).map(function(f){
      return '<dt>'+esc(f[0])+'</dt><dd>'+esc(f[1])+'</dd>';
    }).join("");
    var secs = (a.sections||[]).map(function(s){
      var body = "";
      (s.paras||[]).forEach(function(p){ body += '<p>'+esc(p)+'</p>'; });
      if(s.list && s.list.length){
        body += '<ul>' + s.list.map(function(li){ return '<li>'+esc(li)+'</li>'; }).join("") + '</ul>';
      }
      return '<section class="about-sec"><h2>'+esc(s.heading)+'</h2>'+body+'</section>';
    }).join("");

    app.innerHTML =
      '<div class="about-wrap">' +
        '<a class="back-link" href="#/">← Index</a>' +
        '<h1>'+esc(a.title||"About the course")+'</h1>' +
        (a.tagline ? '<p class="about-tagline">'+esc(a.tagline)+'</p>' : '') +
        (facts ? '<dl class="fact-grid">'+facts+'</dl>' : '') +
        secs +
        (a.note ? '<p class="about-note">'+esc(a.note)+'</p>' : '') +
      '</div>';
    document.title = "About — Financial Statement Analysis";
    window.scrollTo(0,0);
  }

  function matBlock(b){
    if(b.t === "p")  return '<p>'+esc(b.x)+'</p>';
    if(b.t === "note") return '<p class="mat-note">'+esc(b.x)+'</p>';
    if(b.t === "ul" || b.t === "ol"){
      var tag = b.t;
      return '<'+tag+'>' + (b.x||[]).map(function(li){ return '<li>'+esc(li)+'</li>'; }).join("") + '</'+tag+'>';
    }
    if(b.t === "table"){
      var rows = (b.rows||[]).map(function(r, ri){
        var cells = r.map(function(c){
          var cls = (ri>0 && looksNumeric(c)) ? ' class="num"' : '';
          return '<td'+cls+'>'+esc(c)+'</td>';
        }).join("");
        return '<tr>'+cells+'</tr>';
      }).join("");
      return (b.cap ? '<p class="diagram-cap">'+esc(b.cap)+'</p>' : '') +
        '<div class="tbl-wrap"><table class="ledger">'+rows+'</table></div>';
    }
    return "";
  }

  function matShell(key, heading, body){
    var u = DATA[key];
    app.innerHTML = '<div class="mat-wrap">' +
      '<a class="back-link" href="#/'+key+'/1">← '+esc(u.unit)+' slides</a>' +
      '<h1>'+esc(u.unit + ' — ' + heading)+'</h1>' + body +
    '</div>';
    document.title = u.unit + " · " + heading + " — Financial Statement Analysis";
    window.scrollTo(0,0);
  }

  function renderExercises(key){
    if(!hasExercises(key)) return renderDeck(key, 0);
    var ex = MATERIALS[key].exercises;
    var html = ex.intro ? '<p class="mat-intro">'+esc(ex.intro)+'</p>' : '';

    (ex.sets || []).forEach(function(set){
      html += '<div class="mat-set"><div class="mat-set-head">' +
        '<h2>'+esc(set.name)+'</h2>' +
        (set.download ? '<a class="dl-link" href="'+attr(set.download)+'" download>Download (Word) ↓</a>' : '') +
      '</div>';
      (set.items || []).forEach(function(it){
        html += '<div class="exercise">' +
          (it.title ? '<h3>'+esc(it.title)+'</h3>' : '') +
          (it.blocks || []).map(matBlock).join("") +
        '</div>';
      });
      html += '</div>';
    });
    matShell(key, "Exercises", html);
  }

  function renderReferences(key){
    if(!hasReferences(key)) return renderDeck(key, 0);
    var refs = MATERIALS[key].references;
    var html = '<div class="mat-refs">' +
      refs.map(function(r){
        var links = (r.links || []).map(function(l){
          return '<a class="dl-link" href="'+attr(l.file)+'" download>'+esc(l.label)+' ↓</a>';
        }).join("");
        return '<div class="ref-item">' +
          '<span class="ref-label">'+esc(r.label)+'</span>' +
          (r.note ? '<span class="ref-note">'+esc(r.note)+'</span>' : '') +
          '<span class="ref-links">'+links+'</span>' +
        '</div>';
      }).join("") +
    '</div>';
    matShell(key, "Reference material", html);
  }

  function renderDiagram(d){
    if(d.kind === "stack"){
      var rows = (d.rows||[]).map(function(r){ return '<div>'+esc(r)+'</div>'; }).join("");
      return '<div class="diagram"><div class="stackd">'+rows+'</div>' +
        (d.caption ? '<p class="diagram-cap">'+esc(d.caption)+'</p>' : '') + '</div>';
    }
    // kind: "equation"  -> assets | equity/liabilities
    function box(b){
      var items = (b.items||[]).map(function(it){ return '<li>'+esc(it)+'</li>'; }).join("");
      return '<div class="eq-box"><span class="eq-h">'+esc(b.heading)+'</span>' +
        (items ? '<ul>'+items+'</ul>' : '') + '</div>';
    }
    var left = (d.left||[]).map(box).join("");
    var right = (d.right||[]).map(box).join("");
    var note = (d.leftNote || d.rightNote)
      ? '<div class="eq-note"><span>'+esc(d.leftNote||"")+'</span><span>'+esc(d.rightNote||"")+'</span></div>'
      : '';
    return '<div class="diagram"><div class="eq">' +
      '<div class="eq-col left">'+left+'</div>' +
      '<div class="eq-col right">'+right+'</div>' +
    '</div>'+note +
    (d.caption ? '<p class="diagram-cap">'+esc(d.caption)+'</p>' : '') + '</div>';
  }

  function slideInner(slide){
    if(slide.isTitle){
      return '<div class="slide is-divider">' +
        '<div class="divider-title">'+nl2br(slide.title)+'</div>' +
        '<div class="divider-rule"></div>' +
        (slide.subtitle ? '<div class="divider-sub">'+nl2br(slide.subtitle)+'</div>' : '') +
      '</div>';
    }
    var parts = [];
    if(slide.title) parts.push('<h2>'+esc(slide.title)+'</h2>');
    parts.push('<div class="content-body">');

    if(slide.bullets && slide.bullets.length){
      parts.push('<ul class="bullets">' + slide.bullets.map(function(b){
        return '<li data-level="'+b.level+'">'+esc(b.text)+'</li>';
      }).join("") + '</ul>');
    }

    if(slide.diagram){
      parts.push(renderDiagram(slide.diagram));
    }

    (slide.tables||[]).forEach(function(tbl){
      var rows = tbl.map(function(row, ri){
        var cells = row.map(function(c){
          var cls = (ri>0 && looksNumeric(c.text)) ? ' class="num"' : '';
          var attrs = '';
          if(c.colspan>1) attrs += ' colspan="'+c.colspan+'"';
          if(c.rowspan>1) attrs += ' rowspan="'+c.rowspan+'"';
          return '<td'+cls+attrs+'>'+nl2br(c.text)+'</td>';
        }).join("");
        return '<tr>'+cells+'</tr>';
      }).join("");
      parts.push('<div class="tbl-wrap"><table class="ledger">'+rows+'</table></div>');
    });

    (slide.images||[]).forEach(function(img){
      var cap = img.caption || slide.caption || "";
      var alt = attr(img.caption || slide.title || "Slide image");
      parts.push(
        '<figure class="slide-img">' +
          '<img src="'+img.src+'" alt="'+alt+'" onclick="window.__zoom(this.src)">' +
          '<figcaption>' + (cap ? esc(cap)+' ' : '') +
            '<span class="zoom-hint">click to enlarge</span></figcaption>' +
        '</figure>');
    });

    if(!slide.images || !slide.images.length){
      if(slide.caption) parts.push('<p class="diagram-cap">'+esc(slide.caption)+'</p>');
    }

    if(slide.asides && slide.asides.length){
      slide.asides.forEach(function(a){
        parts.push('<span class="aside-note">'+esc(a)+'</span>');
      });
    }

    parts.push('</div>');
    return '<div class="slide">' + parts.join("") + '</div>';
  }

  var state = {key:null, idx:0};

  function renderDeck(key, idx){
    var u = DATA[key];
    if(!u) return renderIndex();
    idx = Math.max(0, Math.min(idx, u.slides.length-1));
    state.key = key; state.idx = idx;
    var slide = u.slides[idx];
    var total = u.slides.length;
    var pct = Math.round(((idx+1)/total)*100);

    app.innerHTML =
      '<div class="deck">' +
        '<div class="deck-bar">' +
          '<a class="back-link" href="#/">← Index</a>' +
          '<span class="deck-title serif">'+esc(u.unit)+' — '+esc(u.name)+'</span>' +
          ((hasExercises(key) || hasReferences(key)) ? '<span class="deck-mat">' +
            (hasExercises(key) ? '<a class="back-link" href="#/'+key+'/exercises">Exercises →</a>' : '') +
            (hasReferences(key) ? '<a class="back-link" href="#/'+key+'/references">Reference →</a>' : '') +
          '</span>' : '') +
          '<span class="deck-pos mono">'+(idx+1)+' / '+total+'</span>' +
        '</div>' +
        '<div class="progress-rule"><div class="progress-fill" style="width:'+pct+'%"></div></div>' +
        '<div class="stage-wrap">' +
          '<div class="tap-zone left" onclick="window.__nav(-1)"></div>' +
          '<div class="stage" id="stage">'+ slideInner(slide) +'</div>' +
          '<div class="tap-zone right" onclick="window.__nav(1)"></div>' +
        '</div>' +
        '<div class="deck-controls">' +
          '<button class="ctrl-btn" onclick="window.__nav(-1)" '+(idx===0?'disabled':'')+'>← Prev</button>' +
          '<button class="ctrl-btn" onclick="window.__nav(1)" '+(idx===total-1?'disabled':'')+'>Next →</button>' +
        '</div>' +
      '</div>';
    document.getElementById('stage').scrollTop = 0;
    var tl = slide.isTitle ? u.name : (slide.title || u.name);
    document.title = u.unit + " · " + tl.replace(/\n/g, " ") + " — Financial Statement Analysis";
  }

  window.__nav = function(delta){
    if(!state.key) return;
    var u = DATA[state.key];
    var next = state.idx + delta;
    if(next<0 || next>=u.slides.length) return;
    location.hash = '#/'+state.key+'/'+(next+1);
  };
  window.__zoom = function(src){
    var box = document.createElement('div');
    box.className = 'lightbox';
    box.innerHTML = '<img src="'+src+'" alt="">';
    box.onclick = function(){ box.remove(); };
    document.body.appendChild(box);
  };

  function route(){
    state.key = null;
    var h = location.hash.replace(/^#\/?/, '');
    if(!h){ renderIndex(); return; }
    if(h === 'about'){ renderAbout(); return; }
    var parts = h.split('/');
    var key = parts[0];
    if(!DATA[key]){ renderIndex(); return; }
    if(parts[1] === 'exercises'){ renderExercises(key); return; }
    if(parts[1] === 'references' || parts[1] === 'materials'){ renderReferences(key); return; }
    var idx = (parseInt(parts[1],10) || 1) - 1;
    renderDeck(key, idx);
  }

  window.addEventListener('hashchange', route);
  document.addEventListener('keydown', function(e){
    var lb = document.querySelector('.lightbox');
    if(lb){ if(e.key==='Escape') lb.remove(); return; }
    if(!state.key) return;
    if(e.key==='ArrowRight' || e.key===' ') window.__nav(1);
    if(e.key==='ArrowLeft') window.__nav(-1);
  });

  applyOverrides();
  route();
})();
</script>
